<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Mã Hóa UTF-8 Chuẩn Tuyệt Đối</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .main-container {
            border: 2px solid #29292e;
            background-color: #1a1a1e;
            padding: 20px;
            border-radius: 12px;
            max-width: 850px;
            width: 100%;
            box-sizing: border-box;
        }
        .main-title {
            text-align: center;
            margin: 0 0 20px 0;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .flex-box {
            display: flex;
            gap: 15px;
        }
        @media (max-width: 600px) {
            .flex-box {
                flex-direction: column;
            }
        }
        .card {
            flex: 1;
            background-color: #202024;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            min-width: 0;
        }
        .box-ma-hoa { border: 2px solid #00adb5; }
        .box-giai-ma { border: 2px solid #4e9f3d; }
        
        .sub-title {
            margin: 0 0 15px 0;
            font-size: 16px;
            text-align: center;
            color: #00adb5;
            font-weight: 600;
        }
        .box-giai-ma .sub-title { color: #4e9f3d; }

        .input-group {
            margin-bottom: 15px;
            position: relative;
        }
        .input-group:last-child {
            margin-bottom: 0;
        }
        .row-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 12px;
            font-weight: bold;
            color: #a8a8b3;
        }
        .counter {
            color: #00adb5;
            font-weight: normal;
        }
        textarea {
            width: 100%;
            height: 100px;
            box-sizing: border-box;
            padding: 10px 10px 35px 10px;
            background-color: #121214;
            border: 1px solid #29292e;
            color: #e1e1e6;
            border-radius: 6px;
            resize: none;
            font-size: 14px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            overflow-y: auto;
        }
        textarea:focus {
            border-color: #555;
            outline: none;
        }
        .copy-btn {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background-color: #29292e;
            color: #a8a8b3;
            border: none;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            z-index: 5;
        }
        .copy-btn.copied {
            background-color: #1b4332;
            color: #52b788;
        }
        .hint {
            font-size: 11px;
            color: #7c7c8a;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h2 class="main-title">Hệ Thống Xử Lý UTF-8</h2>
        
        <div class="flex-box">
            <!-- BẢNG 1: MÃ HÓA -->
            <div class="card box-ma-hoa">
                <h3 class="sub-title">Bảng 1: Mã Hóa</h3>
                <div class="input-group">
                    <div class="row-label">
                        <span>Phần 1: Nhập văn bản thường</span>
                        <span id="bo-dem" class="counter">0 ký tự | 0 byte</span>
                    </div>
                    <textarea id="o-nhap-chu" placeholder="Nhập chữ vào đây..." oninput="chuyenChuThanhMa()" onkeyup="chuyenChuThanhMa()"></textarea>
                </div>
                <div class="input-group">
                    <div class="row-label"><span>Phần 2: Kết quả mã byte UTF-8</span></div>
                    <textarea id="o-xuat-ma" readonly placeholder="Dãy số UTF-8 sẽ tự hiện..."></textarea>
                    <button class="copy-btn" onclick="saoChepVanBan('o-xuat-ma', this)">COPY</button>
                </div>
            </div>

            <!-- BẢNG 2: GIẢI MÃ -->
            <div class="card box-giai-ma">
                <h3 class="sub-title">Bảng 2: Giải Mã</h3>
                <div class="input-group">
                    <div class="row-label"><span>Phần 1: Nhập dãy số UTF-8</span></div>
                    <textarea id="o-nhap-ma" placeholder="Ví dụ dán vào: 116 225 187 137" oninput="chuyenMaThanhChu()" onkeyup="chuyenMaThanhChu()"></textarea>
                    <div class="hint">Các số cách nhau bằng dấu cách.</div>
                </div>
                <div class="input-group">
                    <div class="row-label"><span>Phần 2: Kết quả chữ gốc ban đầu</span></div>
                    <textarea id="o-xuat-chu" readonly placeholder="Chữ dịch ngược sẽ tự hiện..."></textarea>
                    <button class="copy-btn" onclick="saoChepVanBan('o-xuat-chu', this)">COPY</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Khởi tạo các bộ mã hóa tiêu chuẩn toàn cục bên ngoài
        var boMaHoa = new TextEncoder();
        var boGiaiMa = new TextDecoder("utf-8");

        // Hàm dịch chữ thành dãy số UTF-8
        function chuyenChuThanhMa() {
            var vanBanNhap = document.getElementById("o-nhap-chu").value;
            var oKetQuaMa = document.getElementById("o-xuat-ma");
            var oHienThiDem = document.getElementById("bo-dem");

            if (vanBanNhap === "") {
                oKetQuaMa.value = "";
                oHienThiDem.innerText = "0 ký tự | 0 byte";
                return;
            }

            // Tiến hành chuyển đổi và đếm ký tự thực tế
            var mangBytes = boMaHoa.encode(vanBanNhap);
            oHienThiDem.innerText = vanBanNhap.length + " ký tự | " + mangBytes.length + " byte";

            // Biến mảng byte thành chuỗi số cách nhau bởi khoảng trắng
            var chuoiSoFormat = Array.from(mangBytes).join(" ");
            oKetQuaMa.value = chuoiSoFormat;
        }

        // Hàm dịch ngược dãy số UTF-8 thành chữ gốc
        function chuyenMaThanhChu() {
            var maSoNhap = document.getElementById("o-nhap-ma").value.trim();
            var oKetQuaChu = document.getElementById("o-xuat-chu");

            if (maSoNhap === "") {
                oKetQuaChu.value = "";
                return;
            }

            try {
                // Tách chuỗi số bằng khoảng trắng
                var danhSachSoChuoi = maSoNhap.split(/\s+/);
                var mangSoNguyen = [];

                for (var i = 0; i < danhSachSoChuoi.length; i++) {
                    var giaTriSo = parseInt(danhSachSoChuoi[i], 10);
                    // Kiểm tra giá trị số hợp lệ của byte dữ liệu (0-255)
                    if (isNaN(giaTriSo) || giaTriSo < 0 || giaTriSo > 255) {
                        throw new Error();
                    }
                    mangSoNguyen.push(giaTriSo);
                }

                // Thực hiện giải mã mảng số nguyên thành chữ tiếng Việt
                var mảngUint8 = new Uint8Array(mangSoNguyen);
                var chuGocSauDich = boGiaiMa.decode(mảngUint8);
                oKetQuaChu.value = chuGocSauDich;
            } catch (error) {
                oKetQuaChu.value = "[Lỗi: Dãy số nhập vào chưa đúng định dạng byte UTF-8 (0-255)]";
            }
        }

        // Hàm xử lý sao chép nhanh (Tự động fallback cho mọi cấu trúc thiết bị)
        function saoChepVanBan(idPhanTu, nutBam) {
            var oCanCopy = document.getElementById(idPhanTu);
            if (oCanCopy.value === "" || oCanCopy.value.indexOf("[Lỗi") === 0) {
                return;
            }

            // Cách 1: Thử dùng API hiện đại
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(oCanCopy.value).then(function() {
                    doiTrangThaiNut(nutBam);
                }).catch(function() {
                    chayCopyDuPhong(oCanCopy, nutBam);
                });
            } else {
                // Cách 2: Chạy dự phòng cho môi trường không có HTTPS hoặc thiết bị cũ
                chayCopyDuPhong(oCanCopy, nutBam);
            }
        }

        // Hàm chạy lệnh copy cổ điển phòng hờ lỗi bảo mật hệ thống
        function chayCopyDuPhong(element, nutBam) {
            element.select();
            document.execCommand("copy");
            doiTrangThaiNut(nutBam);
        }

        // Hiệu ứng đổi chữ trên nút bấm khi copy thành công
        function doiTrangThaiNut(nutBam) {
            nutBam.innerText = "COPIED ✔";
            nutBam.classList.add("copied");
            setTimeout(function() {
                nutBam.innerText = "COPY";
                nutBam.classList.remove("copied");
            }, 1500);
        }
    </script>
</body>
</html>
