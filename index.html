<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ Mã hóa & Giải mã UTF-8 Siêu Cấp</title>
    <style>

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .bang-lon {
            border: 2px solid #29292e;
            background-color: #1a1a1e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 900px;
            width: 100%;
        }
        .tieu-de-lon {
            text-align: center;
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .khu-vuc-bang-nho {
            display: flex;
            gap: 25px;
        }
        @media (max-width: 768px) {
            .khu-vuc-bang-nho { display: flex; flex-direction: column; }
        }

        .bang-nho {
            flex: 1;
            background-color: #202024;
            border-radius: 12px;
            padding: 20px;
            transition: border 0.3s ease;
        }
        .bang-nho-1 { border: 2px solid #00adb5; }
        .bang-nho-2 { border: 2px solid #4e9f3d; }
        
        .tieu-de-nho {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 19px;
            text-align: center;
            font-weight: 600;
        }
        .bang-nho-1 .tieu-de-nho { color: #00adb5; }
        .bang-nho-2 .tieu-de-nho { color: #4e9f3d; }


        .phan-o {
            margin-bottom: 20px;
            position: relative;
        }
        .phan-o:last-child {
            margin-bottom: 0;
        }
        .nhãn-hàng {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        label {
            font-weight: bold;
            font-size: 13px;
            color: #a8a8b3;
        }

        .thong-ke {
            font-size: 12px;
            color: #00adb5;
            font-weight: normal;
        }
        textarea {
            width: 100%;
            height: 90px;
            box-sizing: border-box;
            padding: 12px;
            background-color: #121214;
            border: 1px solid #29292e;
            color: #e1e1e6;
            border-radius: 8px;
            resize: none;
            font-size: 14px;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }
        textarea:focus {
            border-color: #555;
            outline: none;
        }

        .nut-copy {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: #29292e;
            color: #a8a8b3;
            border: none;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .nut-copy:hover {
            background-color: #3e3e44;
            color: #ffffff;
        }
        .nut-copy.copied {
            background-color: #1b4332;
            color: #52b788;
        }
        .goi-y {
            font-size: 11px;
            color: #7c7c8a;
            margin-top: 4px;
        }
    </style>
</head>
<body>


    <div class="bang-lon">
        <h2 class="tieu-de-lon">Hệ Thống Xử Lý Mã Hóa UTF-8</h2>
        
        <div class="khu-vuc-bang-nho">
            
            <div class="bang-nho bang-nho-1">
                <h3 class="tieu-de-nho">Bảng Nhỏ 1: Mã Hóa</h3>
                
                <div class="phan-o">
                    <div class="nhãn-hàng">
                        <label for="input-text">Phần 1: Nhập văn bản thường</label>
                        <span id="dem-text" class="thong-ke">0 ký tự | 0 byte</span>
                    </div>
                    <textarea id="input-text" placeholder="Nhập chữ có dấu... Ví dụ: tỉ đô" oninput="maHoaUTF8()"></textarea>
                </div>

                <div class="phan-o">
                    <div class="nhãn-hàng">
                        <label for="output-code">Phần 2: Kết quả mã byte UTF-8</label>
                    </div>
                    <textarea id="output-code" readonly placeholder="Dãy số UTF-8 sẽ tự hiện..."></textarea>
                    <button class="nut-copy" onclick="copyText('output-code', this)">COPY</button>
                </div>
            </div>

            <div class="bang-nho bang-nho-2">
                <h3 class="tieu-de-nho">Bảng Nhỏ 2: Giải Mã</h3>
                
                <div class="phan-o">
                    <div class="nhãn-hàng">
                        <label for="input-code">Phần 1: Nhập dãy số UTF-8</label>
                    </div>
                    <textarea id="input-code" placeholder="Ví dụ dán vào: 116 225 187 137" oninput="giaiMaUTF8()"></textarea>
                    <div class="goi-y">Các số từ 0 - 255 cách nhau bằng dấu cách.</div>
                </div>

                <div class="phan-o">
                    <div class="nhãn-hàng">
                        <label for="output-text">Phần 2: Kết quả chữ gốc ban đầu</label>
                    </div>
                    <textarea id="output-text" readonly placeholder="Chữ dịch ngược sẽ tự hiện..."></textarea>
                    <button class="nut-copy" onclick="copyText('output-text', this)">COPY</button>
                </div>
            </div>

        </div>
    </div>

    <script>

        const encoder = new TextEncoder();
        const decoder = new TextDecoder("utf-8");

        function maHoaUTF8() {
            const text = document.getElementById("input-text").value;
            const outputField = document.getElementById("output-code");
            const counterField = document.getElementById("dem-text");
            
            if (!text) {
                outputField.value = "";
                counterField.innerText = "0 ký tự | 0 byte";
                return;
            }
            
            const utf8Bytes = encoder.encode(text);
            
            const charCount = text.length;
            const byteCount = utf8Bytes.length;
            counterField.innerText = `${charCount} ký tự | ${byteCount} byte`;
            
            outputField.value = Array.from(utf8Bytes).join(" ");
        }

        function giaiMaUTF8() {
            const codeInput = document.getElementById("input-code").value.trim();
            const outputField = document.getElementById("output-text");
            
            if (!codeInput) {
                outputField.value = "";
                return;
            }

            try {

                const stringNumbers = codeInput.split(/\s+/);
                const byteNumbers = stringNumbers.map(num => {
                    const parsed = parseInt(num, 10);
                    if (isNaN(parsed) || parsed < 0 || parsed > 255) {
                        throw new Error();
                    }
                    return parsed;
                });

                const byteArray = new Uint8Array(byteNumbers);
                outputField.value = decoder.decode(byteArray);
            } catch (error) {
                outputField.value = "[Lỗi: Dãy số nhập vào chưa đúng định dạng byte UTF-8 (0-255)]";
            }
        }


        function copyText(elementId, buttonElement) {
            const targetTextArea = document.getElementById(elementId);
            if (!targetTextArea.value || targetTextArea.value.startsWith("[Lỗi")) return;


            navigator.clipboard.writeText(targetTextArea.value).then(() => {

                buttonElement.innerText = "COPIED ✔";
                buttonElement.classList.add("copied");


                setTimeout(() => {
                    buttonElement.innerText = "COPY";
                    buttonElement.classList.remove("copied");
                }, 1500);
            }).catch(err => {
                console.error("Không thể copy: ", err);
            });
        }
    </script>
</body>
</html>
