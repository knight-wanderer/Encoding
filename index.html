<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ Mã hóa UTF-8 & Base64 Siêu Cấp</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .main-container {
            border: 2px solid #29292e;
            background-color: #1a1a1e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 900px;
            width: 100%;
        }
        .main-title {
            text-align: center;
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .sub-container-wrapper {
            display: flex;
            gap: 25px;
        }
        @media (max-width: 768px) {
            .sub-container-wrapper { flex-direction: column; }
        }
        .sub-container {
            flex: 1;
            background-color: #202024;
            border-radius: 12px;
            padding: 20px;
        }
        .encoder-box { border: 2px solid #00adb5; }
        .decoder-box { border: 2px solid #4e9f3d; }
        
        .sub-title {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 19px;
            text-align: center;
            font-weight: 600;
        }
        .encoder-box .sub-title { color: #00adb5; }
        .decoder-box .sub-title { color: #4e9f3d; }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }
        .input-group:last-child {
            margin-bottom: 0;
        }
        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        label {
            font-weight: bold;
            font-size: 13px;
            color: #a8a8b3;
        }
        .counter-info {
            font-size: 12px;
            color: #00adb5;
        }
        textarea {
            width: 100%;
            height: 90px;
            box-sizing: border-box;
            padding: 12px;
            background-color: #121214;
            border: 1px solid #29292e;
            color: #e1e1e6;
            border-radius: 8px;
            resize: none;
            font-size: 14px;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
        }
        textarea:focus {
            border-color: #555;
            outline: none;
        }
        select {
            background-color: #121214;
            color: #e1e1e6;
            border: 1px solid #29292e;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .copy-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: #29292e;
            color: #a8a8b3;
            border: none;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .copy-btn:hover {
            background-color: #3e3e44;
            color: #ffffff;
        }
        .copy-btn.copied {
            background-color: #1b4332;
            color: #52b788;
        }
        .hint-text {
            font-size: 11px;
            color: #7c7c8a;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h2 class="main-title">Hệ Thống Mã Hóa Đa Năng</h2>
        
        <div class="sub-container-wrapper">
            
            <!-- BẢNG MÃ HÓA -->
            <div class="sub-container encoder-box">
                <h3 class="sub-title">Bảng 1: Mã Hóa</h3>
                
                <div class="input-group">
                    <div class="label-row">
                        <label for="input-text">Phần 1: Nhập văn bản</label>
                        <span id="char-counter" class="counter-info">0 ký tự | 0 byte</span>
                    </div>
                    <textarea id="input-text" placeholder="Nhập chữ vào đây..." oninput="handleEncode()"></textarea>
                </div>
                
                <div class="input-group">
                    <div class="label-row">
                        <label for="output-code">Phần 2: Kết quả mã hóa</label>
                        <select id="encode-type" onchange="handleEncode()">
                            <option value="utf8">Mã Byte UTF-8</option>
                            <option value="base64">Mã Base64</option>
                        </select>
                    </div>
                    <textarea id="output-code" readonly placeholder="Kết quả tự động xuất hiện..."></textarea>
                    <button class="copy-btn" onclick="copyToClipboard('output-code', this)">COPY</button>
                </div>
            </div>

            <!-- BẢNG GIẢI MÃ -->
            <div class="sub-container decoder-box">
                <h3 class="sub-title">Bảng 2: Giải Mã</h3>
                
                <div class="input-group">
                    <div class="label-row">
                        <label for="input-code">Phần 1: Nhập chuỗi/dãy mã</label>
                        <select id="decode-type" onchange="handleDecode()">
                            <option value="utf8">Dãy số UTF-8</option>
                            <option value="base64">Chuỗi Base64</option>
                        </select>
                    </div>
                    <textarea id="input-code" placeholder="Dán mã cần giải vào đây..." oninput="handleDecode()"></textarea>
                    <div id="decode-hint" class="hint-text">Các số từ 0 - 255 cách nhau bằng dấu cách.</div>
                </div>
                
                <div class="input-group">
                    <div class="label-row">
                        <label for="output-text">Phần 2: Kết quả dịch ngược</label>
                    </div>
                    <textarea id="output-text" readonly placeholder="Chữ gốc sẽ tự hiện..."></textarea>
                    <button class="copy-btn" onclick="copyToClipboard('output-text', this)">COPY</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        const encoder = new TextEncoder();
        const decoder = new TextDecoder("utf-8");

        // Hàm xử lý mã hóa tự động
        function handleEncode() {
            const text = document.getElementById("input-text").value;
            const outputField = document.getElementById("output-code");
            const counterField = document.getElementById("char-counter");
            const mode = document.getElementById("encode-type").value;
            
            if (!text) {
                outputField.value = "";
                counterField.innerText = "0 ký tự | 0 byte";
                return;
            }
            
            const utf8Bytes = encoder.encode(text);
            counterField.innerText = `${text.length} ký tự | ${utf8Bytes.length} byte`;
            
            if (mode === "utf8") {
                outputField.value = Array.from(utf8Bytes).join(" ");
            } else if (mode === "base64") {
                // Chuyển chuỗi UTF-8 sang dạng mã hóa Base64 an toàn cho tiếng Việt
                const binaryString = Array.from(utf8Bytes, byte => String.fromCharCode(byte)).join("");
                outputField.value = btoa(binaryString);
            }
        }

        // Hàm xử lý giải mã tự động
        function handleDecode() {
            const codeInput = document.getElementById("input-code").value.trim();
            const outputField = document.getElementById("output-text");
            const mode = document.getElementById("decode-type").value;
            const hintField = document.getElementById("decode-hint");
            
            // Cập nhật dòng gợi ý hiển thị
            if (mode === "utf8") {
                hintField.innerText = "Các số từ 0 - 255 cách nhau bằng dấu cách.";
            } else {
                hintField.innerText = "Chuỗi chữ mã hóa Base64 (thường có dấu = ở cuối).";
            }

            if (!codeInput) {
                outputField.value = "";
                return;
            }

            try {
                if (mode === "utf8") {
                    const stringNumbers = codeInput.split(/\s+/);
                    const byteNumbers = stringNumbers.map(num => {
                        const parsed = parseInt(num, 10);
                        if (isNaN(parsed) || parsed < 0 || parsed > 255) throw new Error();
                        return parsed;
                    });
                    outputField.value = decoder.decode(new Uint8Array(byteNumbers));
                } else if (mode === "base64") {
                    // Dịch ngược chuỗi Base64 về lại chữ chuẩn UTF-8
                    const binaryString = atob(codeInput);
                    const len = binaryString.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }
                    outputField.value = decoder.decode(bytes);
                }
            } catch (error) {
                outputField.value = "[Lỗi: Dữ liệu nhập vào sai định dạng mã đã chọn!]";
            }
        }

        // Hàm copy nhanh
function copyToClipboard(elementId, buttonElement) {
    const target = document.getElementById(elementId);
    if (!target.value || target.value.startsWith("[Lỗi")) return;
    navigator.clipboard.writeText(target.value).then(() => {
        buttonElement.innerText = "COPIED ✔";
        buttonElement.classList.add("copied");setTimeout(() => {
            buttonElement.innerText = "COPY";
            buttonElement.classList.remove("copied");
        }, 1500);
    });
}
